name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    outputs:
      validate-pages: ${{ steps.scope.outputs.validate-pages }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        run: |
          import fnmatch
          import json
          import os
          import subprocess
          scopes = {'validate-pages': {'paths': ['web/**', '.github/workflows/pages.yml', '.github/workflows/ci.yml'], 'branches': []}}
          selected = {job: False for job in scopes}
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              with open(os.environ["GITHUB_EVENT_PATH"]) as source:
                  pull_request = json.load(source)["pull_request"]
              revision = pull_request["base"]["sha"] + "..." + pull_request["head"]["sha"]
              paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", revision]).decode().split("\0")
              selected = {
                  job: (not rule["paths"] or any(fnmatch.fnmatchcase(path, pattern) for path in paths for pattern in rule["paths"]))
                  and (not rule["branches"] or any(fnmatch.fnmatchcase(pull_request["base"]["ref"], branch) for branch in rule["branches"]))
                  for job, rule in scopes.items()
              }
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print(f"allow-skipped={json.dumps([job for job, active in selected.items() if not active])}", file=output)

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --quiet --locked -p server-lab-native --bin experiment -- 10 5 5 1 1000
      - name: Run native multiplayer recovery experiment
        run: cargo run --quiet --locked -p server-lab-native --bin multiplayer-recovery-experiment
      - name: Build packet-level netem probes
        run: cargo build --locked -p server-lab-native --bin server --bin client --bin netem-udp
      - name: Run packet-level netem experiment
        run: sudo bash native/netem/experiment.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Test authoritative presentation model
        run: bun test ../authoritative/web-tests
      - name: Build authoritative WebTransport browser client
        run: bun build ../authoritative/web/client.js --target=browser --outdir=/tmp/authoritative-webtransport-client

  validate-pages:
    needs: validation-scope
    if: github.event_name == 'pull_request' && needs.validation-scope.outputs.validate-pages == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() }}
    needs: ["rust", "web", "validate-pages", "validation-scope"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["rust", "web", "validate-pages", "validation-scope"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --quiet --locked -p server-lab-native --bin experiment -- 10 5 5 1 1000
      - name: Run native multiplayer recovery experiment
        run: cargo run --quiet --locked -p server-lab-native --bin multiplayer-recovery-experiment
      - name: Build packet-level netem probes
        run: cargo build --locked -p server-lab-native --bin server --bin client --bin netem-udp
      - name: Run packet-level netem experiment
        run: sudo bash native/netem/experiment.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Test authoritative presentation model
        run: bun test ../authoritative/web-tests
      - name: Build authoritative WebTransport browser client
        run: bun build ../authoritative/web/client.js --target=browser --outdir=/tmp/authoritative-webtransport-client

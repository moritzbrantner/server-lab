[package]
name = "server-lab-authoritative"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "authoritative-tcp-server"
path = "src/bin/tcp-server.rs"

[[bin]]
name = "authoritative-webtransport-server"
path = "src/bin/webtransport-server.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
wtransport = { version = "0.7.2", default-features = false, features = ["ring"] }
